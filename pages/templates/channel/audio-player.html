<div class="file-card file-card-audio">
  <table class="file-card-header" cellpadding="0" cellspacing="0">
    <tr>
      <td class="file-card-icon" valign="middle"><img src="/resources/images/files/audio.png" width="30" height="40" alt="" /></td>
      <td class="file-card-info" valign="middle">
        <div class="file-card-name"><a href="{$FILE_LINK}" class="file-card-link" title="{$FILE_NAME}"><font face="'rodin', Arial, Helvetica, sans-serif" color="#00A8FC">{$FILE_NAME}</font></a></div>
        <div class="file-card-size"><font face="'rodin', Arial, Helvetica, sans-serif" color="#949BA4">{$FILE_SIZE}</font></div>
      </td>
    </tr>
  </table>
  <audio controls preload="none" class="file-card-player">
    <source src="{$FILE_LINK}" type="{$MIME_TYPE}" />
    <!-- Fallback for older browsers -->
    <embed src="{$FILE_LINK}" type="{$MIME_TYPE}" autostart="false" width="300" height="40" /><br />
    <a href="{$FILE_LINK}">Download audio file</a>
  </audio>
</div>
