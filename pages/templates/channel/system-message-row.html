<table cellpadding="0" cellspacing="0" width="100%" class="system-message-row" style="margin: 0; padding: 4px 0; padding-left: 12px">
  <colgroup><col class="message-avatar-col" /><col class="message-content-col" /></colgroup>
  <tr>
    <td class="message-avatar-cell system-message-icon-cell" align="center" valign="top">{$ICON}</td>
    <td class="message-body-cell"><font style="font-size: 15px; color: {$COLOR}" face="rodin,sans-serif" class="system-message-font"><font style="font-weight: 600; color: {$AUTHOR_COLOR}" class="system-message-author">{$AUTHOR_NAME}</font>{$TEXT}</font> <font style="font-size: 12px; font-size: var(--msg-meta-font-size, 12px)" face="rodin,sans-serif" class="message-date-font">{$DATE}</font>{$EXTRA}</td>
  </tr>
</table>
