<!doctype html>
<html lang="en" class="page-simple">
  <head>
    {$COMMON_HEAD}
    
  </head>

  <body style="margin: 0" {$WHITE_THEME_ENABLED}>
    <div id="wrapper">
      <table style="width: 100%">
        <tr valign="middle">
          <td style="width: 64px; min-width: 64px">
            <a href="/server/"><img src="/resources/logo.gif" alt="Logo" width="64" height="64" /></a>
          </td>
          <td>
            <font size="7" face="'rodin', Arial, Helvetica, sans-serif" color="#dddddd">discross</font>
          </td>
          <td width="100%" align="right">
            <font size="4" face="'rodin', Arial, Helvetica, sans-serif" color="#dddddd">{$MENU_OPTIONS}</font>
          </td>
          <td valign="middle" style="padding-left: 8px; padding-right: 8px;">
            <a href="/switchtheme"><img src="/resources/twemoji/1f313.gif" alt="Switch theme" width="36" height="36" style="background: none; border: none" /></a>
          </td>
        </tr>
      </table>
      <hr style="margin: 0" />
      <br />
      <table>
        <tr>
          <td>&nbsp;&nbsp;&nbsp;&nbsp;</td>
          <td>
            <font face="'rodin', Arial, Helvetica, sans-serif" color="#dddddd">
              <font size="5">Search</font>
              <br />
              <form method="GET" action="/search">
                <input type="hidden" name="sessionID" value="{$SESSION_ID}" />
                <table cellpadding="0" cellspacing="4">
                  <tr>
                    <td>
                      <div style="padding: 8px 12px; background: #222327; display: block; width: 100%"><input type="text" name="q" value="{$QUERY_VALUE}" placeholder="Enter search query..." style=" color: #dddddd; background: #222327; border: none; width: 100%; min-width: 120px; outline: none; font-family: 'rodin', Arial, Helvetica, sans-serif; font-size: 15px; " /></div>
                    </td>
                    <td style="padding-left: 8px">
                      <button type="submit" class="discross-button" style="padding: 8px 18px; margin: 0; font-size: 15px">Search</button>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2" style="padding-top: 8px">
                      <font size="3" face="'rodin', Arial, Helvetica, sans-serif" color="#dddddd">Search engine:</font><br />
                      <label style="font-size: 14px">
                        <input type="radio" name="engine" value="duckduckgo" {$DUCKDUCKGO_CHECKED} />
                        DuckDuckGo <font size="2" color="#72767d">(for old browsers)</font> </label><br />
                      <label style="font-size: 14px">
                        <input type="radio" name="engine" value="frogfind" {$FROGFIND_CHECKED} />
                        FrogFind <font size="2" color="#72767d">(may be down)</font> </label><br />
                      <label style="font-size: 14px">
                        <input type="radio" name="engine" value="wiby" {$WIBY_CHECKED} /> Wiby.me
                        <font size="2" color="#72767d">(for classic sites)</font> </label><br />
                      <label style="font-size: 14px">
                        <input type="radio" name="engine" value="google" {$GOOGLE_CHECKED} /> Google
                        <font size="2" color="#72767d">(for modern browsers)</font>
                      </label>
                    </td>
                  </tr>
                </table>
              </form>

              <br />
              <font size="5">Search Discord Messages</font>
              <br />
              <form method="GET" action="/search">
                <input type="hidden" name="sessionID" value="{$SESSION_ID}" />
                <table cellpadding="0" cellspacing="4">
                  <tr>
                    <td>
                      <select name="dguild" style="padding: 8px; background: #222327; color: #dddddd; border: none; font-family: 'rodin', Arial, Helvetica, sans-serif; font-size: 15px;" {$DISCORD_SEARCH_DISABLED}>
                        {$SERVER_OPTIONS}
                      </select>
                    </td>
                    <td style="padding-left: 8px">
                      <div style="padding: 8px 12px; background: #222327; display: block; width: 100%"><input type="text" name="dchannel" value="{$DISCORD_CHANNEL_VALUE}" placeholder="Channel (optional)" {$DISCORD_SEARCH_DISABLED} style="color: #dddddd; background: #222327; border: none; width: 140px; outline: none; font-family: 'rodin', Arial, Helvetica, sans-serif; font-size: 15px;" /></div>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <div style="padding: 8px 12px; background: #222327; display: block; width: 100%"><input type="text" name="dq" value="{$DISCORD_QUERY_VALUE}" placeholder="Search message content..." {$DISCORD_SEARCH_DISABLED} style="color: #dddddd; background: #222327; border: none; width: 100%; min-width: 120px; outline: none; font-family: 'rodin', Arial, Helvetica, sans-serif; font-size: 15px;" /></div>
                    </td>
                    <td style="padding-left: 8px">
                      <button type="submit" class="discross-button" {$DISCORD_SEARCH_DISABLED} style="padding: 8px 18px; margin: 0; font-size: 15px">Search</button>
                    </td>
                  </tr>
                </table>
              </form>

              <div style="margin-top: 8px; max-width: 640px;">
                {$DISCORD_RESULTS}
              </div>
            </font>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
