<!doctype html>
<html lang="en" class="page-simple">
<head>
  <title>Snake - Discross</title>
  <style>
    body { background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; padding: 20px; }
    h1 { margin-bottom: 10px; color: #fff; }
    #game-board { margin: 0 auto; border-collapse: collapse; border: 4px solid #555; background-color: #222; }
    #game-board td { width: 20px; height: 20px; padding: 0; margin: 0; }
    .cell-empty { background-color: #222; }
    .cell-snake { background-color: #00ff00; }
    .cell-apple { background-color: #ff0000; }
    #score { font-size: 24px; margin-bottom: 20px; color: #fff; }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score">SCORE: 0</div>
  <table id="game-board"></table>
  <p style="color: #ccc;">Use Arrow Keys to move</p>
  <script>
    var boardSize = 15;
    var board = [];
    var snake = [{x: 7, y: 7}];
    var apple = {x: 3, y: 3};
    var dx = 1;
    var dy = 0;
    var score = 0;
    var gameInterval;
    var isGameOver = false;

    var table = document.getElementById('game-board');
    for (var y = 0; y < boardSize; y++) {
      var tr = document.createElement('tr');
      board[y] = [];
      for (var x = 0; x < boardSize; x++) {
        var td = document.createElement('td');
        td.className = 'cell-empty';
        tr.appendChild(td);
        board[y][x] = td;
      }
      table.appendChild(tr);
    }

    function placeApple() {
      var valid = false;
      while(!valid) {
        apple.x = Math.floor(Math.random() * boardSize);
        apple.y = Math.floor(Math.random() * boardSize);
        valid = true;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === apple.x && snake[i].y === apple.y) {
            valid = false;
            break;
          }
        }
      }
    }

    function draw() {
      for (var y = 0; y < boardSize; y++) {
        for (var x = 0; x < boardSize; x++) {
          board[y][x].className = 'cell-empty';
        }
      }
      board[apple.y][apple.x].className = 'cell-apple';
      for (var i = 0; i < snake.length; i++) {
        board[snake[i].y][snake[i].x].className = 'cell-snake';
      }
      document.getElementById('score').innerHTML = 'SCORE: ' + score;
    }

    function update() {
      if (isGameOver) return;
      var head = {x: snake[0].x + dx, y: snake[0].y + dy};

      if (head.x < 0 || head.x >= boardSize || head.y < 0 || head.y >= boardSize) {
        gameOver();
        return;
      }
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);
      if (head.x === apple.x && head.y === apple.y) {
        score += 10;
        placeApple();
      } else {
        snake.pop();
      }
      draw();
    }

    function gameOver() {
      isGameOver = true;
      clearInterval(gameInterval);
      alert('GAME OVER! SCORE: ' + score + '\\nRefresh to play again.');
    }

    document.onkeydown = function(e) {
      e = e || window.event;
      var key = e.keyCode;
      if (key === 37 && dx === 0) { dx = -1; dy = 0; }
      else if (key === 38 && dy === 0) { dx = 0; dy = -1; }
      else if (key === 39 && dx === 0) { dx = 1; dy = 0; }
      else if (key === 40 && dy === 0) { dx = 0; dy = 1; }
      
      if (key >= 37 && key <= 40) {
        if (e.preventDefault) e.preventDefault();
        return false;
      }
    };

    placeApple();
    draw();
    gameInterval = setInterval(update, 200);
  </script>
</body>
</html>
